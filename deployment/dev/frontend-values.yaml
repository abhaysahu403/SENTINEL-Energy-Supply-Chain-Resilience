replicaCount: 1

image:
  repository: acrsentineldev2026.azurecr.io/sentinel-frontend
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

autoscaling:
  enabled: false

ingress:
  enabled: true
  host: dev.sentinel.local

env:
  VITE_ENV: development