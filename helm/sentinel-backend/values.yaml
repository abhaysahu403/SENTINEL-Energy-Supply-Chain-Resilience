# ============================================================
# SENTINEL Backend Helm Chart - Production Values
# ============================================================
# This values file controls the deployment of the SENTINEL
# backend API on Azure Kubernetes Service (AKS).
# ============================================================

# -- Number of backend pod replicas
replicaCount: 2

image:
  # -- Backend Docker image repository (Azure Container Registry)
  repository: acrsentineldev2026.azurecr.io/sentinel-backend
  # -- Image pull policy
  pullPolicy: Always
  # -- Overrides the image tag (default is the chart appVersion)
  tag: "v1"

# -- Image pull secrets for private container registry
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the resources
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 8000
  # -- Target port on the container
  targetPort: 8000
  # -- Service annotations
  annotations: {}

ingress:
  # -- Enable ingress controller resource
  enabled: true
  # -- Ingress class name
  className: "nginx"
  # -- Ingress annotations
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  # -- Ingress hosts configuration
  hosts:
    - host: api.sentinel.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
    # - secretName: sentinel-backend-tls
    #   hosts:
    #     - api.sentinel.local

# -- Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: http
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health
    port: http
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# -- Startup probe configuration
startupProbe:
  httpGet:
    path: /health
    port: http
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 12

autoscaling:
  # -- Enable horizontal pod autoscaling
  enabled: true
  # -- Minimum number of replicas
  minReplicas: 2
  # -- Maximum number of replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 70
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: 80

# -- Additional volumes (SQLite database storage)
volumes:
  - name: data
    emptyDir: {}

# -- Additional volume mounts
volumeMounts:
  - name: data
    mountPath: /app

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - sentinel-backend
          topologyKey: kubernetes.io/hostname

# ============================================================
# Application Configuration
# ============================================================

config:
  # -- Application environment (dev, qa, prod)
  appEnv: "production"
  
  # -- Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  logLevel: "INFO"
  
  # -- Enable autoplay mode for event simulation
  autoplay: "0"
  
  # -- Simulator interval in seconds
  simulatorInterval: "30"
  
  # -- Python unbuffered mode for logging
  pythonUnbuffered: "1"
  
  # -- CORS origins (comma-separated)
  corsOrigins: "https://sentinel.example.com"

# ============================================================
# Secrets Configuration
# ============================================================

secrets:
  # -- JWT secret for authentication (REQUIRED)
  # Generate with: openssl rand -base64 32
  jwtSecret: ""
  
  # -- Use existing secret instead of creating new one
  existingSecret: ""

# ============================================================
# Network Policy
# ============================================================

networkPolicy:
  # -- Enable network policy
  enabled: true
  # -- Pod selector labels
  podSelector:
    matchLabels: {}
  # -- Ingress rules
  ingress:
    # -- Allow from frontend
    - from:
      - namespaceSelector:
          matchLabels:
            name: sentinel
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: sentinel-frontend
    # -- Allow from ingress controller
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
  # -- Egress rules
  egress:
    # -- Allow DNS
    - to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
    # -- Allow HTTPS for external APIs
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

# ============================================================
# Pod Disruption Budget
# ============================================================

podDisruptionBudget:
  # -- Enable pod disruption budget
  enabled: true
  # -- Minimum available pods
  minAvailable: 1
  # -- Maximum unavailable pods (alternative to minAvailable)
  # maxUnavailable: 1

# ============================================================
# Deployment Strategy
# ============================================================

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30
