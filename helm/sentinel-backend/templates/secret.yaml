{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | required "secrets.jwtSecret is required! Generate with: openssl rand -base64 32" | quote }}
{{- end }}
