# ============================================================
# SENTINEL Frontend Helm Chart - Production Values
# ============================================================
# This values file controls the deployment of the SENTINEL
# frontend application on Azure Kubernetes Service (AKS).
# ============================================================

# -- Number of frontend pod replicas
replicaCount: 2

image:
  # -- Frontend Docker image repository (Azure Container Registry)
  repository: acrsentineldev2026.azurecr.io/sentinel-frontend
  # -- Image pull policy
  pullPolicy: Always
  # -- Overrides the image tag (default is the chart appVersion)
  tag: "v1"

# -- Image pull secrets for private container registry
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the resources
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101  # nginx user
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 101

service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 80
  # -- Target port on the container
  targetPort: 80
  # -- Service annotations
  annotations: {}

ingress:
  # -- Enable ingress controller resource
  enabled: true
  # -- Ingress class name
  className: "nginx"
  # -- Ingress annotations
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  # -- Ingress hosts configuration
  hosts:
    - host: sentinel.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
    # - secretName: sentinel-frontend-tls
    #   hosts:
    #     - sentinel.local

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# -- Startup probe configuration
startupProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 2
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 10

autoscaling:
  # -- Enable horizontal pod autoscaling
  enabled: true
  # -- Minimum number of replicas
  minReplicas: 2
  # -- Maximum number of replicas
  maxReplicas: 6
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 70
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: 80

# -- Additional volumes (nginx needs writable dirs)
volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-pid
    emptyDir: {}

# -- Additional volume mounts
volumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
  - name: nginx-pid
    mountPath: /var/run

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - sentinel-frontend
          topologyKey: kubernetes.io/hostname

# ============================================================
# Application Configuration
# ============================================================

config:
  # -- Backend API URL (used at build time via VITE_API_BASE)
  # This should match the backend ingress URL
  apiBaseUrl: "http://api.sentinel.local"
  
  # -- Backend service URL (internal cluster communication)
  backendServiceUrl: "http://sentinel-backend:8000"

# ============================================================
# Network Policy
# ============================================================

networkPolicy:
  # -- Enable network policy
  enabled: true
  # -- Pod selector labels
  podSelector:
    matchLabels: {}
  # -- Ingress rules
  ingress:
    # -- Allow from ingress controller only
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
  # -- Egress rules
  egress:
    # -- Allow DNS
    - to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
    # -- Allow to backend service
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: sentinel-backend
      ports:
      - protocol: TCP
        port: 8000

# ============================================================
# Deployment Strategy
# ============================================================

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30
