apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-backend
  namespace: sentinel
  labels:
    app: sentinel
    component: backend
    tier: application
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sentinel
      component: backend
  template:
    metadata:
      labels:
        app: sentinel
        component: backend
        tier: application
    spec:
      containers:
      - name: backend
        image: acrsentinelabhay.azurecr.io/sentinel-backend:v1
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        # QuickStart mode - uses SQLite, NetworkX, and in-memory queue
        - name: SENTINEL_AUTOPLAY
          valueFrom:
            configMapKeyRef:
              name: sentinel-config
              key: sentinel-autoplay
        - name: SENTINEL_SIM_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: sentinel-config
              key: sentinel-sim-interval
        - name: SENTINEL_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: jwt-secret
        - name: PYTHONUNBUFFERED
          value: "1"
        
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12
        
        volumeMounts:
        - name: data
          mountPath: /app
      
      volumes:
      - name: data
        emptyDir: {}
      
      terminationGracePeriodSeconds: 30
