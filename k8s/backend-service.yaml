apiVersion: v1
kind: Service
metadata:
  name: sentinel-backend
  namespace: sentinel
  labels:
    app: sentinel
    component: backend
    tier: application
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  selector:
    app: sentinel
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-backend-headless
  namespace: sentinel
  labels:
    app: sentinel
    component: backend
    tier: application
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  selector:
    app: sentinel
    component: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-backend-pdb
  namespace: sentinel
  labels:
    app: sentinel
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sentinel
      component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinel-backend-hpa
  namespace: sentinel
  labels:
    app: sentinel
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinel-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
