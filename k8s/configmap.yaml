apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: sentinel
  labels:
    app: sentinel
data:
  # Backend API URL for frontend (will be backend service within cluster)
  api-base-url: "http://sentinel-backend:8000"
  
  # Application Settings
  sentinel-autoplay: "1"
  sentinel-sim-interval: "30"
  
  # Logging Configuration
  log-level: "INFO"
