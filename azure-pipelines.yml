trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  backendImage: 'sentinel-backend'
  frontendImage: 'sentinel-frontend'

stages:
- stage: Build
  displayName: Build Docker Images

  jobs:
  - job: Build
    displayName: Build Images

    steps:

    - checkout: self

    - task: DockerInstaller@0
      displayName: Install Docker

    - script: |
        docker version
      displayName: Verify Docker

    - script: |
        docker build -t $(backendImage):$(Build.BuildId) ./backend
      displayName: Build Backend

    - script: |
        docker build -t $(frontendImage):$(Build.BuildId) ./frontend
      displayName: Build Frontend