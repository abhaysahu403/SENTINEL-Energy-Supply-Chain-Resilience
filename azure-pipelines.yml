# Azure DevOps Pipeline for SENTINEL Application
# This pipeline builds Docker images, pushes to ACR, and deploys to AKS

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - frontend/**
      - k8s/**
      - azure-pipelines.yml

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Azure Resources
  azureSubscription: 'Azure-Sentinel-ServiceConnection'
  resourceGroup: 'rg-sentinel-dev'
  aksCluster: 'aks-sentinel-dev'
  acrServiceConnection: 'acrsentinelabhay'
  acrLoginServer: 'acrsentinelabhay.azurecr.io'
  
  # Images
  backendImage: '$(acrLoginServer)/sentinel-backend'
  frontendImage: '$(acrLoginServer)/sentinel-frontend'
  imageTag: 'v$(Build.BuildId)'
  
  # Kubernetes
  namespace: 'sentinel'

stages:
# ============================================================
# STAGE 1: BUILD AND PUSH DOCKER IMAGES
# ============================================================
- stage: Build
  displayName: 'Build and Push Docker Images'
  jobs:
  - job: BuildImages
    displayName: 'Build Docker Images'
    steps:
    
    - checkout: self
      displayName: 'Checkout Code'
    
    # Build Backend Image
    - task: Docker@2
      displayName: 'Build Backend Image'
      inputs:
        command: build
        repository: 'sentinel-backend'
        dockerfile: 'backend/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(imageTag)
          latest
    
    # Build Frontend Image
    - task: Docker@2
      displayName: 'Build Frontend Image'
      inputs:
        command: build
        repository: 'sentinel-frontend'
        dockerfile: 'frontend/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)/frontend'
        tags: |
          $(imageTag)
          latest
    
    # Login to ACR
    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        command: login
        containerRegistry: '$(acrServiceConnection)'
    
    # Push Backend Image to ACR
    - task: Docker@2
      displayName: 'Push Backend to ACR'
      inputs:
        command: push
        repository: 'sentinel-backend'
        containerRegistry: '$(acrServiceConnection)'
        tags: |
          $(imageTag)
          latest
    
    # Push Frontend Image to ACR
    - task: Docker@2
      displayName: 'Push Frontend to ACR'
      inputs:
        command: push
        repository: 'sentinel-frontend'
        containerRegistry: '$(acrServiceConnection)'
        tags: |
          $(imageTag)
          latest
    
    # Publish K8s manifests as artifacts
    - task: PublishPipelineArtifact@1
      displayName: 'Publish K8s Manifests'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/k8s'
        artifact: 'k8s-manifests'
        publishLocation: 'pipeline'

# ============================================================
# STAGE 2: DEPLOY TO AKS
# ============================================================
- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToAKS
    displayName: 'Deploy to AKS Cluster'
    environment: 'sentinel-production'
    strategy:
      runOnce:
        deploy:
          steps:
          
          # Download K8s manifests artifact
          - download: current
            artifact: k8s-manifests
            displayName: 'Download K8s Manifests'
          
          # Install kubectl
          - task: KubectlInstaller@0
            displayName: 'Install kubectl'
            inputs:
              kubectlVersion: 'latest'
          
          # Get AKS Credentials
          - task: AzureCLI@2
            displayName: 'Get AKS Credentials'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(resourceGroup) \
                  --name $(aksCluster) \
                  --overwrite-existing
          
          # Create Namespace (if not exists)
          - task: Kubernetes@1
            displayName: 'Create Namespace'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: '$(azureSubscription)'
              azureResourceGroup: '$(resourceGroup)'
              kubernetesCluster: '$(aksCluster)'
              command: 'apply'
              arguments: '-f $(Pipeline.Workspace)/k8s-manifests/namespace.yaml'
              outputFormat: 'none'
          
          # Create/Update ConfigMap
          - task: Kubernetes@1
            displayName: 'Apply ConfigMap'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: '$(azureSubscription)'
              azureResourceGroup: '$(resourceGroup)'
              kubernetesCluster: '$(aksCluster)'
              command: 'apply'
              arguments: '-f $(Pipeline.Workspace)/k8s-manifests/configmap.yaml'
              outputFormat: 'none'
          
          # Create Secret (JWT Secret)
          - task: AzureCLI@2
            displayName: 'Create/Update Secrets'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Check if secret exists
                if kubectl get secret sentinel-secrets -n $(namespace) &> /dev/null; then
                  echo "Secret exists, skipping creation"
                else
                  echo "Creating secret..."
                  kubectl create secret generic sentinel-secrets \
                    --namespace=$(namespace) \
                    --from-literal=jwt-secret="$(JWT_SECRET)"
                fi
          
          # Update Backend Deployment with new image
          - task: KubernetesManifest@0
            displayName: 'Deploy Backend'
            inputs:
              action: 'deploy'
              connectionType: 'Azure Resource Manager'
              azureSubscriptionConnection: '$(azureSubscription)'
              azureResourceGroup: '$(resourceGroup)'
              kubernetesCluster: '$(aksCluster)'
              namespace: '$(namespace)'
              manifests: |
                $(Pipeline.Workspace)/k8s-manifests/backend-deployment.yaml
                $(Pipeline.Workspace)/k8s-manifests/backend-service.yaml
              containers: '$(backendImage):$(imageTag)'
          
          # Update Frontend Deployment with new image
          - task: KubernetesManifest@0
            displayName: 'Deploy Frontend'
            inputs:
              action: 'deploy'
              connectionType: 'Azure Resource Manager'
              azureSubscriptionConnection: '$(azureSubscription)'
              azureResourceGroup: '$(resourceGroup)'
              kubernetesCluster: '$(aksCluster)'
              namespace: '$(namespace)'
              manifests: |
                $(Pipeline.Workspace)/k8s-manifests/frontend-deployment.yaml
                $(Pipeline.Workspace)/k8s-manifests/frontend-service.yaml
              containers: '$(frontendImage):$(imageTag)'
          
          # Wait for deployment to complete
          - task: Kubernetes@1
            displayName: 'Wait for Backend Rollout'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: '$(azureSubscription)'
              azureResourceGroup: '$(resourceGroup)'
              kubernetesCluster: '$(aksCluster)'
              namespace: '$(namespace)'
              command: 'rollout'
              arguments: 'status deployment/sentinel-backend --timeout=5m'
          
          - task: Kubernetes@1
            displayName: 'Wait for Frontend Rollout'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: '$(azureSubscription)'
              azureResourceGroup: '$(resourceGroup)'
              kubernetesCluster: '$(aksCluster)'
              namespace: '$(namespace)'
              command: 'rollout'
              arguments: 'status deployment/sentinel-frontend --timeout=5m'
          
          # Get LoadBalancer IP
          - task: AzureCLI@2
            displayName: 'Get Application URL'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Waiting for LoadBalancer IP..."
                sleep 30
                EXTERNAL_IP=$(kubectl get svc sentinel-frontend -n $(namespace) -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                echo "##########################################################"
                echo "Application URL: http://$EXTERNAL_IP"
                echo "Backend API: http://$EXTERNAL_IP:8000"
                echo "API Docs: http://$EXTERNAL_IP:8000/docs"
                echo "##########################################################"
          
          # Verify Deployment
          - task: Kubernetes@1
            displayName: 'Get Pod Status'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: '$(azureSubscription)'
              azureResourceGroup: '$(resourceGroup)'
              kubernetesCluster: '$(aksCluster)'
              namespace: '$(namespace)'
              command: 'get'
              arguments: 'pods'
              outputFormat: 'wide'
