name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install flake8
          flake8 backend/app

      - name: Run Unit Tests
        run: |
          cd backend
          pytest

      - name: Build Docker Image
        run: |
          docker build \
          -t sentinel-backend:pr-${{ github.run_number }} .