name: Production Deployment

on:
  push:
    branches:
      - main

env:
  REGISTRY: acrsentineldev2026.azurecr.io
  AKS_RESOURCE_GROUP: rg-sentinel-dev
  AKS_CLUSTER: aks-sentinel-dev
  NAMESPACE: sentinel

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: Production
      url: https://sentinel.local

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd backend
          pytest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name acrsentineldev2026

      - name: Build Backend Image
        run: |
          docker build \
          -t $REGISTRY/sentinel-backend:${{ github.run_number }} \
          -t $REGISTRY/sentinel-backend:latest \
          -f backend/Dockerfile \
          ./backend

      - name: Build Frontend Image
        run: |
          docker build \
          -t $REGISTRY/sentinel-frontend:${{ github.run_number }} \
          -t $REGISTRY/sentinel-frontend:latest \
          -f frontend/Dockerfile \
          ./frontend

      - name: Push Backend Image
        run: |
          docker push $REGISTRY/sentinel-backend:${{ github.run_number }}
          docker push $REGISTRY/sentinel-backend:latest

      - name: Push Frontend Image
        run: |
          docker push $REGISTRY/sentinel-frontend:${{ github.run_number }}
          docker push $REGISTRY/sentinel-frontend:latest

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
          --resource-group $AKS_RESOURCE_GROUP \
          --name $AKS_CLUSTER \
          --overwrite-existing

      - name: Deploy Backend
        run: |
          helm upgrade --install sentinel-backend \
          helm/sentinel-backend \
          --namespace $NAMESPACE \
          --create-namespace \
          --set image.tag=${{ github.run_number }} \
          --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}"

      - name: Deploy Frontend
        run: |
          helm upgrade --install sentinel-frontend \
          helm/sentinel-frontend \
          --namespace $NAMESPACE \
          --set image.tag=${{ github.run_number }}

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/sentinel-backend \
          -n $NAMESPACE \
          --timeout=300s

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/sentinel-frontend \
          -n $NAMESPACE \
          --timeout=300s

      - name: Health Check
        run: |
          echo "Checking deployment status..."
          kubectl get pods -n $NAMESPACE
          kubectl get svc -n $NAMESPACE
          kubectl get ingress -n $NAMESPACE
          
          # Verify pods are ready
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=sentinel-backend -n $NAMESPACE --timeout=60s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=sentinel-frontend -n $NAMESPACE --timeout=60s
          
          echo "All services deployed successfully!"

      - name: Rollback Backend on Failure
        if: failure()
        run: |
          echo "Rolling back backend..."
          kubectl rollout undo deployment/sentinel-backend -n $NAMESPACE

      - name: Rollback Frontend on Failure
        if: failure()
        run: |
          echo "Rolling back frontend..."
          kubectl rollout undo deployment/sentinel-frontend -n $NAMESPACE