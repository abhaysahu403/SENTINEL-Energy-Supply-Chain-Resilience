name: Production Deployment

on:
  push:
    branches:
      - main

env:
  REGISTRY: acrsentineldev2026.azurecr.io
  IMAGE_NAME: sentinel-backend
  AKS_RESOURCE_GROUP: sentinel-rg
  AKS_CLUSTER: sentinel-aks
  NAMESPACE: sentinel

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: Production
      url: https://sentinel.local

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd backend
          pytest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name acrsentineldev2026

      - name: Build Docker Image
        run: |
          docker build \
          -t $REGISTRY/$IMAGE_NAME:${{ github.run_number }} .

      - name: Push Docker Image
        run: |
          docker push \
          $REGISTRY/$IMAGE_NAME:${{ github.run_number }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
          --resource-group $AKS_RESOURCE_GROUP \
          --name $AKS_CLUSTER \
          --overwrite-existing

      - name: Deploy
        run: |
          helm upgrade --install sentinel-backend \
          helm/sentinel-backend \
          --namespace $NAMESPACE \
          --create-namespace \
          --reuse-values \
          --set image.tag=${{ github.run_number }}

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/sentinel-backend \
          -n $NAMESPACE \
          --timeout=300s

      - name: Health Check
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh

      - name: Rollback on Failure
        if: failure()
        run: |
          kubectl rollout undo deployment/sentinel-backend \
          -n $NAMESPACE