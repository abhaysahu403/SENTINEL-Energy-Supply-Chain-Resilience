name: Development Deployment

on:

  push:
    branches:
      - develop

env:

  REGISTRY: acrsentineldev2026.azurecr.io
  IMAGE_NAME: sentinel-backend
  NAMESPACE: sentinel

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Unit Test
        run: |
          cd backend
          pytest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name acrsentineldev2026

      - name: Build Backend Image
        run: |
          docker build \
          -t $REGISTRY/sentinel-backend:${{ github.run_number }} \
          -f backend/Dockerfile \
          ./backend

      - name: Build Frontend Image
        run: |
          docker build \
          -t $REGISTRY/sentinel-frontend:${{ github.run_number }} \
          -f frontend/Dockerfile \
          ./frontend

      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/sentinel-backend:${{ github.run_number }}

      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/sentinel-frontend:${{ github.run_number }}

      - name: Push Backend Image
        run: |
          docker push $REGISTRY/sentinel-backend:${{ github.run_number }}

      - name: Push Frontend Image
        run: |
          docker push $REGISTRY/sentinel-frontend:${{ github.run_number }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
          --resource-group rg-sentinel-dev \
          --name aks-sentinel-dev \
          --overwrite-existing

      - name: Deploy Backend using Helm
        run: |
          helm upgrade --install sentinel-backend \
          helm/sentinel-backend \
          --namespace sentinel \
          --create-namespace \
          --set image.tag=${{ github.run_number }} \
          --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}"

      - name: Deploy Frontend using Helm
        run: |
          helm upgrade --install sentinel-frontend \
          helm/sentinel-frontend \
          --namespace sentinel \
          --set image.tag=${{ github.run_number }}

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/sentinel-backend -n sentinel --timeout=300s

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/sentinel-frontend -n sentinel --timeout=300s

      - name: Health Check
        run: |
          echo "Checking pod status..."
          kubectl get pods -n sentinel
          kubectl get svc -n sentinel
          kubectl get ingress -n sentinel
          
          # Check backend health via kubectl port-forward
          echo "Verifying backend pod is running..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=sentinel-backend -n sentinel --timeout=60s
          
          echo "Backend deployed successfully!"