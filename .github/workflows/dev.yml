name: Development Deployment

on:

  push:
    branches:
      - develop

env:

  REGISTRY: acrsentineldev2026.azurecr.io
  IMAGE_NAME: sentinel-backend
  NAMESPACE: sentinel

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Unit Test
        run: |
          cd backend
          pytest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name acrsentineldev2026

      - name: Build Docker Image
        run: |
          docker build \
          -t $REGISTRY/$IMAGE_NAME:${{ github.run_number }} .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Push Image
        run: |
          docker push \
          $REGISTRY/$IMAGE_NAME:${{ github.run_number }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
          --resource-group sentinel-rg \
          --name sentinel-aks \
          --overwrite-existing

      - name: Deploy using Helm
        run: |
          helm upgrade --install sentinel-backend \
          helm/sentinel-backend \
          --namespace sentinel \
          --create-namespace \
          --set image.tag=${{ github.run_number }}

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/sentinel-backend -n sentinel

      - name: Health Check
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh