name: Staging Deployment

on:

  push:

    branches:

      - "release/**"

env:
  REGISTRY: acrsentineldev2026.azurecr.io
  AKS_RESOURCE_GROUP: rg-sentinel-dev
  AKS_CLUSTER: aks-sentinel-dev
  NAMESPACE: sentinel

jobs:

  staging:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Test
        run: |
          cd backend
          pytest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name acrsentineldev2026

      - name: Build Backend Image
        run: |
          docker build \
          -t $REGISTRY/sentinel-backend:${{ github.run_number }} \
          -f backend/Dockerfile \
          .

      - name: Build Frontend Image
        run: |
          docker build \
          -t $REGISTRY/sentinel-frontend:${{ github.run_number }} \
          -f frontend/Dockerfile \
          ./frontend

      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/sentinel-backend:${{ github.run_number }}

      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/sentinel-frontend:${{ github.run_number }}

      - name: Push Backend Image
        run: |
          docker push $REGISTRY/sentinel-backend:${{ github.run_number }}

      - name: Push Frontend Image
        run: |
          docker push $REGISTRY/sentinel-frontend:${{ github.run_number }}

      - name: AKS Login
        run: |
          az aks get-credentials \
          --resource-group $AKS_RESOURCE_GROUP \
          --name $AKS_CLUSTER \
          --overwrite-existing

      - name: Deploy Backend
        run: |
          helm upgrade --install sentinel-backend \
          helm/sentinel-backend \
          --namespace $NAMESPACE \
          --create-namespace \
          --set image.tag=${{ github.run_number }} \
          --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}"

      - name: Deploy Frontend
        run: |
          helm upgrade --install sentinel-frontend \
          helm/sentinel-frontend \
          --namespace $NAMESPACE \
          --set image.tag=${{ github.run_number }}

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/sentinel-backend -n $NAMESPACE --timeout=300s

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/sentinel-frontend -n $NAMESPACE --timeout=300s

      - name: Health Check
        run: |
          echo "Verifying deployments..."
          kubectl get pods -n $NAMESPACE
          kubectl get svc -n $NAMESPACE
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=sentinel-backend -n $NAMESPACE --timeout=60s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=sentinel-frontend -n $NAMESPACE --timeout=60s
          echo "Staging deployment successful!"