name: Staging Deployment

on:

  push:

    branches:

      - "release/**"

env:

  REGISTRY: acrsentineldev2026.azurecr.io
  IMAGE_NAME: sentinel-backend

jobs:

  staging:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Test
        run: |
          cd backend
          pytest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name acrsentineldev2026

      - name: Docker Build
        run: |
          docker build \
          -t $REGISTRY/$IMAGE_NAME:${{ github.run_number }} .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Push Image
        run: |
          docker push \
          $REGISTRY/$IMAGE_NAME:${{ github.run_number }}

      - name: AKS Login
        run: |
          az aks get-credentials \
          --resource-group sentinel-rg \
          --name sentinel-aks \
          --overwrite-existing

      - name: Deploy
        run: |
          helm upgrade --install sentinel-backend \
          helm/sentinel-backend \
          --namespace sentinel \
          --set image.tag=${{ github.run_number }}

      - name: Rollout Status
        run: |
          kubectl rollout status deployment/sentinel-backend -n sentinel

      - name: Smoke Test
        run: |
          curl http://4.188.115.109/health