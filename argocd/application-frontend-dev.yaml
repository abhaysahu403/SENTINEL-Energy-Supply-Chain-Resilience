apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-frontend-dev
  namespace: argocd
  labels:
    app: sentinel
    component: frontend
    environment: dev
spec:
  project: default
  
  source:
    repoURL: https://github.com/abhaysahu403/SENTINEL-Energy-Supply-Chain-Resilience.git
    targetRevision: main
    path: helm/sentinel-frontend
    helm:
      valueFiles:
        - values-dev.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel-dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
